<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Vue字面量入门</title>
    <!-- CDN引入Vue3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
<div id="app">
    <h1>{{ msg }}</h1>
    <p>计数：{{ count }}</p>
    <button @click="add">点我+1</button>
</div>
​
<script>
    const { createApp } = Vue
    // 字面量创建Vue实例
    createApp({
        data() {
            return {
                msg: 'Vue字面量练习',
                count: 0
            }
        },
        methods:{
            add(){
                this.count++
            }
        }
    }).mount('#app')
</script>
</body>
</html>
